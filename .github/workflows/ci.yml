# Runs on every push/PR: lint + unit tests (no models or PDFs needed).
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --python 3.12
      - run: uv run ruff check src tests eval ui
      - run: uv run pytest -q
